# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

kotlin.code.style=official

# KSP2 traga los errores de resolucion de Kotlin y reporta sintomas de Hilt;
# KSP1 muestra el error raiz (necesario mientras se itera via CI).
ksp.useKSP2=false

# El cache incremental de KSP/Kotlin traga los errores de resolucion
# (sintoma: Hilt reporta "could not be resolved" sin error raiz impreso).
# Desactivado hasta que el build vuelva a verde.
ksp.incremental=false
kotlin.incremental=false
